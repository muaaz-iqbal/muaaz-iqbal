<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071019">
        <animate attributeName="stop-color" values="#071019;#0a2418;#071019" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.55" stop-color="#0b1e2d">
        <animate attributeName="stop-color" values="#0b1e2d;#123a2a;#0b1e2d" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#041018">
        <animate attributeName="stop-color" values="#041018;#062015;#041018" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#4ade80"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0; 0.4 0; -0.4 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="320" rx="20" fill="url(#grid)"/>

  <!-- floating particles -->
  <g fill="#4ade80">
    <circle cx="700" cy="260" r="3" opacity="0">
      <animate attributeName="cy" values="280;70" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="260" r="2.5" opacity="0" fill="#fbbf24">
      <animate attributeName="cy" values="290;60" dur="9s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="260" r="3.5" opacity="0">
      <animate attributeName="cy" values="300;80" dur="8s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="8s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="260" r="2" opacity="0" fill="#fbbf24">
      <animate attributeName="cy" values="280;90" dur="6.5s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="6.5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- name + taglines -->
  <text x="64" y="128" font-size="66" font-weight="800" letter-spacing="3" fill="url(#name)">MUAAZ IQBAL</text>
  <rect x="66" y="146" height="6" rx="3" fill="url(#name)" width="0">
    <animate attributeName="width" values="0;430;430" keyTimes="0;0.55;1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="64" y="192" font-size="24" fill="#e2e8f0">Full-Stack &amp; Android Developer · AI Orchestrator</text>
  <text x="64" y="224" font-size="20" fill="#94a3b8">Founder of Mizanora  · Muslim Islam Org · M1 Traders 📈</text>
  <text x="64" y="258" font-size="18" fill="#86efac">📍 Kasur, Punjab, Pakistan 🇵 · 🎂 27 Nov 2009 · 🎓 ICS, Islamia Graduate College</text>
  <text x="64" y="290" font-size="16" fill="#64748b" font-style="italic">“Unchi soch. Chhote qadam.” — high thinking, small steps.</text>

  <!-- animated candlestick chart (trading theme) -->
  <g stroke-linecap="round">
    <g stroke="#22c55e" stroke-opacity="0.55" stroke-width="2">
      <line x1="827" y1="110" x2="827" y2="255"/><line x1="915" y1="95" x2="915" y2="250"/>
      <line x1="1003" y1="80" x2="1003" y2="240"/><line x1="1091" y1="60" x2="1091" y2="220"/>
    </g>
    <g stroke="#ef4444" stroke-opacity="0.55" stroke-width="2">
      <line x1="871" y1="120" x2="871" y2="260"/><line x1="959" y1="100" x2="959" y2="250"/>
      <line x1="1047" y1="85" x2="1047" y2="235"/><line x1="1135" y1="70" x2="1135" y2="225"/>
    </g>
    <rect x="820" y="190" width="14" height="50" rx="2" fill="#22c55e">
      <animate attributeName="y" values="190;150;190" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="height" values="50;90;50" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="864" y="170" width="14" height="70" rx="2" fill="#ef4444">
      <animate attributeName="y" values="170;200;170" dur="3.2s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="height" values="70;40;70" dur="3.2s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="908" y="160" width="14" height="60" rx="2" fill="#22c55e">
      <animate attributeName="y" values="160;120;160" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="height" values="60;100;60" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="952" y="180" width="14" height="55" rx="2" fill="#ef4444">
      <animate attributeName="y" values="180;205;180" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="height" values="55;30;55" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="996" y="140" width="14" height="75" rx="2" fill="#22c55e">
      <animate attributeName="y" values="140;105;140" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="height" values="75;110;75" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="1040" y="165" width="14" height="50" rx="2" fill="#ef4444">
      <animate attributeName="y" values="165;190;165" dur="3.2s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="height" values="50;25;50" dur="3.2s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="1084" y="120" width="14" height="80" rx="2" fill="#22c55e">
      <animate attributeName="y" values="120;85;120" dur="3.2s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="height" values="80;115;80" dur="3.2s" begin="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="1128" y="145" width="14" height="60" rx="2" fill="#22c55e">
      <animate attributeName="y" values="145;100;145" dur="3.2s" begin="2.8s" repeatCount="indefinite"/>
      <animate attributeName="height" values="60;105;60" dur="3.2s" begin="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- growing gold trend line -->
  <path d="M 800 235 C 860 215, 900 245, 960 185 S 1060 160, 1150 95" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-dasharray="520" stroke-dashoffset="520">
    <animate attributeName="stroke-dashoffset" values="520;0;0" keyTimes="0;0.75;1" dur="5s" repeatCount="indefinite"/>
  </path>
  <circle cx="1150" cy="95" r="6" fill="#fbbf24">
    <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
