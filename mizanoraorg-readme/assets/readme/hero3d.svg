<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.6" stop-color="#0a1420"/>
      <stop offset="1" stop-color="#071a12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0; 0.3 0; -0.3 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ctop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="tt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="hglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#bg)"/>
  <ellipse cx="600" cy="210" rx="520" ry="90" fill="url(#hglow)"/>

  <!-- stars -->
  <g fill="#e2e8f0">
    <circle cx="120" cy="60" r="1.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="40" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="70" r="1.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.4s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="35" r="1.3"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="55" r="1.7"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.8s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="90" r="1.2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.1s" begin="1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 3D perspective floor -->
  <g stroke="#1f4d3a" stroke-width="1.4" opacity="0.4">
    <line x1="600" y1="205" x2="-300" y2="430"/><line x1="600" y1="205" x2="-100" y2="430"/>
    <line x1="600" y1="205" x2="100" y2="430"/><line x1="600" y1="205" x2="300" y2="430"/>
    <line x1="600" y1="205" x2="500" y2="430"/><line x1="600" y1="205" x2="700" y2="430"/>
    <line x1="600" y1="205" x2="900" y2="430"/><line x1="600" y1="205" x2="1100" y2="430"/>
    <line x1="600" y1="205" x2="1300" y2="430"/><line x1="600" y1="205" x2="1500" y2="430"/>
  </g>
  <g stroke="#22c55e" stroke-width="1.6">
    <line x1="0" x2="1200" y1="210" y2="210" opacity="0">
      <animate attributeName="y1" values="210;430" dur="4s" repeatCount="indefinite"/><animate attributeName="y2" values="210;430" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.15;0.8;1" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="0" x2="1200" y1="210" y2="210" opacity="0">
      <animate attributeName="y1" values="210;430" dur="4s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="y2" values="210;430" dur="4s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.15;0.8;1" dur="4s" begin="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="0" x2="1200" y1="210" y2="210" opacity="0">
      <animate attributeName="y1" values="210;430" dur="4s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="y2" values="210;430" dur="4s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.15;0.8;1" dur="4s" begin="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="0" x2="1200" y1="210" y2="210" opacity="0">
      <animate attributeName="y1" values="210;430" dur="4s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="y2" values="210;430" dur="4s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.15;0.8;1" dur="4s" begin="2.4s" repeatCount="indefinite"/>
    </line>
    <line x1="0" x2="1200" y1="210" y2="210" opacity="0">
      <animate attributeName="y1" values="210;430" dur="4s" begin="3.2s" repeatCount="indefinite"/><animate attributeName="y2" values="210;430" dur="4s" begin="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.15;0.8;1" dur="4s" begin="3.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- extruded 3D title -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="6s" repeatCount="indefinite"/>
    <text x="80" y="160" font-size="86" font-weight="900" letter-spacing="6" fill="#2a1d05">MIZANORA</text>
    <text x="78" y="158" font-size="86" font-weight="900" letter-spacing="6" fill="#4a3308">MIZANORA</text>
    <text x="76" y="156" font-size="86" font-weight="900" letter-spacing="6" fill="#6b4a0c">MIZANORA</text>
    <text x="74" y="154" font-size="86" font-weight="900" letter-spacing="6" fill="#8a6110">MIZANORA</text>
    <text x="72" y="152" font-size="86" font-weight="900" letter-spacing="6" fill="#b07d15">MIZANORA</text>
    <text x="70" y="150" font-size="86" font-weight="900" letter-spacing="6" fill="url(#gold)">MIZANORA</text>
  </g>
  <text x="72" y="196" font-size="22" fill="#b6c6d8">Mizanora Platform — her project · her kahani · ek jagah mehfooz</text>

  <!-- chips -->
  <g font-family="Consolas, Menlo, monospace" font-size="14" font-weight="700">
    <rect x="70" y="216" width="180" height="32" rx="16" fill="#0d1622" stroke="#22c55e" stroke-opacity="0.5"/>
    <text x="88" y="237" fill="#86efac">ZERO-BUILD STATIC</text>
    <rect x="262" y="216" width="300" height="32" rx="16" fill="#0d1622" stroke="#f59e0b" stroke-opacity="0.5">
      <animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="280" y="237" fill="#fcd34d">FIREBASE AUTH · FIRESTORE · STORAGE</text>
    <rect x="574" y="216" width="300" height="32" rx="16" fill="#0d1622" stroke="#22c55e" stroke-opacity="0.5"/>
    <text x="592" y="237" fill="#86efac">GITHUB PAGES + FIREBASE HOSTING</text>
    <rect x="886" y="216" width="70" height="32" rx="16" fill="#0d1622" stroke="#67e8f9" stroke-opacity="0.5"/>
    <text x="906" y="237" fill="#67e8f9">MIT</text>
  </g>

  <!-- floating isometric cubes + orbit -->
  <ellipse cx="900" cy="140" rx="130" ry="40" fill="none" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="2" transform="rotate(-8 900 140)"/>
  <circle r="6" fill="#fde68a">
    <animateMotion dur="9s" repeatCount="indefinite" path="M 770 140 A 130 40 0 1 0 1030 140 A 130 40 0 1 0 770 140"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="5s" repeatCount="indefinite"/>
    <polygon points="900,70 960.9,105 900,140 839.1,105" fill="url(#ctop)"/>
    <polygon points="900,140 960.9,105 960.9,175 900,210" fill="#c47f0e"/>
    <polygon points="900,140 839.1,105 839.1,175 900,210" fill="#92600a"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" dur="7s" begin="1s" repeatCount="indefinite"/>
    <polygon points="1060,195 1099.2,217.5 1060,240 1020.8,217.5" fill="url(#gt)"/>
    <polygon points="1060,240 1099.2,217.5 1099.2,262.5 1060,285" fill="#15803d"/>
    <polygon points="1060,240 1020.8,217.5 1020.8,262.5 1060,285" fill="#166534"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="6s" begin="0.5s" repeatCount="indefinite"/>
    <polygon points="790,233 817.8,249 790,265 762.2,249" fill="url(#tt)"/>
    <polygon points="790,265 817.8,249 817.8,281 790,297" fill="#0e7490"/>
    <polygon points="790,265 762.2,249 762.2,281 790,297" fill="#155e75"/>
  </g>
  <ellipse cx="900" cy="238" rx="60" ry="12" fill="#000" opacity="0.4">
    <animate attributeName="rx" values="60;48;60" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1060" cy="305" rx="38" ry="9" fill="#000" opacity="0.35">
    <animate attributeName="rx" values="38;30;38" dur="7s" begin="1s" repeatCount="indefinite"/>
  </ellipse>

  <text x="72" y="400" font-size="16" font-style="italic" fill="#64748b">⚖️ Mizan = balance · Noor = illumination — “Unchi soch. Chhote qadam.” · Muaaz Iqbal, Kasur 🇵🇰</text>
</svg>
